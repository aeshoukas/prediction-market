<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Predict | Live Market</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0e11; --card: #161a1e; --green: #00c076;
            --red: #e11d48; --blue: #0066FF; --border: #2b2f36; --text-secondary: #848e9c;
        }

        body { 
            font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; 
            margin: 0; padding: 15px; display: flex; flex-direction: column;
            height: 100vh; box-sizing: border-box; overflow: hidden;
        }

        .gauge-section {
            flex-shrink: 0; height: 130px; display: flex; justify-content: center; align-items: flex-end; position: relative;
        }
        .gauge-wrapper { width: 180px; height: 90px; position: relative; }
        .price-overlay { position: absolute; bottom: 0; width: 100%; text-align: center; }
        .price-val { font-size: 42px; font-weight: 900; color: var(--green); line-height: 1; }
        .price-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; font-weight: 800; }

        .question-box { flex-shrink: 0; padding: 10px 0; text-align: center; }
        h1 { font-size: 1.15rem; margin: 0; line-height: 1.3; font-weight: 700; }

        .chart-container {
            flex-grow: 1; background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 10px; margin: 5px 0; min-height: 100px;
        }

        .action-area { flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn {
            border: none; border-radius: 16px; padding: 18px 10px;
            font-weight: 800; font-size: 1.1rem; color: white; text-transform: uppercase;
        }
        .btn-yes { background: var(--green); box-shadow: 0 4px 0 #008453; }
        .btn-no { background: var(--red); box-shadow: 0 4px 0 #9f1239; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        #status { text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-secondary); min-height: 1.2em; }
    </style>
</head>
<body>

    <div class="gauge-section">
        <div class="gauge-wrapper">
            <canvas id="gaugeChart"></canvas>
            <div class="price-overlay">
                <div id="price" class="price-val">--¢</div>
                <div class="price-label">Chance of YES</div>
            </div>
        </div>
    </div>

    <div class="question-box"><h1 id="q-text">Connecting...</h1></div>

    <div class="chart-container"><canvas id="feverLineChart"></canvas></div>

    <div class="action-area">
        <div class="btn-group">
            <button class="btn btn-yes" onclick="sendVote('yes')">Yes</button>
            <button class="btn btn-no" onclick="sendVote('no')">No</button>
        </div>
        <div id="status"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNYTlmO6HWFgHIPwVuXCSAWcrcoNoHVTPgDpbwOuVdhLUxsQ6epzYtG38-PTgFRDOo/exec";
        let gaugeChart, feverChart;

        async function update() {
            try {
                const res = await fetch(API_URL);
                let data = await res.json();
                if (Array.isArray(data)) data = data[0];
                document.getElementById('q-text').innerText = data.question;
                document.getElementById('price').innerText = (data.percent || 50) + "¢";
                drawGauge(data.percent || 50);
                drawFever(data.history || [50]);
            } catch(e) { console.error(e); }
        }

        function drawGauge(val) {
            const ctx = document.getElementById('gaugeChart').getContext('2d');
            if (gaugeChart) { gaugeChart.data.datasets[0].data = [val, 100-val]; gaugeChart.update(); return; }
            gaugeChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [val, 100-val], backgroundColor: ['#00c076', '#2b2f36'], borderWidth: 0, circumference: 180, rotation: 270, borderRadius: 10 }] },
                options: { 
                    cutout: '90%', // Thinner mobile gauge
                    maintainAspectRatio: false, 
                    plugins: { legend: {display: false}, tooltip: {enabled: false} } 
                }
            });
        }

        function drawFever(history) {
            const ctx = document.getElementById('feverLineChart').getContext('2d');
            if (feverChart) { feverChart.data.labels = history.map((_, i) => i); feverChart.data.datasets[0].data = history; feverChart.update('none'); return; }
            feverChart = new Chart(ctx, {
                type: 'line',
                data: { labels: history.map((_, i) => i), datasets: [{ data: history, borderColor: '#0066FF', borderWidth: 3, fill: true, backgroundColor: 'rgba(0, 102, 255, 0.1)', tension: 0.4, pointRadius: 0 }] },
                options: { 
                    maintainAspectRatio: false, plugins: { legend: {display: false} },
                    scales: { y: { min: 0, max: 100, grid: { color: '#2b2f36' }, ticks: { color: '#848e9c', font: {size: 10}, stepSize: 25, callback: (v)=>v==0?'0':v==25?'25¢':v==50?'50¢':v==75?'75¢':v==100?'$1':'' } }, x: { display: false } }
                }
            });
        }

        async function sendVote(side) {
            document.getElementById('status').innerText = "Processing...";
            await fetch(`${API_URL}?qIndex=0&vote=${side}`, { mode: 'no-cors' });
            document.getElementById('status').innerText = "Vote Registered!";
            setTimeout(() => { document.getElementById('status').innerText = ""; update(); }, 2000);
        }

        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
