<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vote</title>
    <style>
        :root { --yes: #00AB6B; --no: #E11D48; --bg: #F0F2F5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        .card { background: white; border-radius: 24px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 30px; line-height: 1.3; font-weight: 800; }
        .btn { border: none; border-radius: 16px; padding: 20px; font-weight: 800; font-size: 1.2rem; cursor: pointer; color: white; width: 100%; margin-bottom: 15px; transition: transform 0.1s; }
        .btn-yes { background: var(--yes); border-bottom: 6px solid #008453; }
        .btn-no { background: var(--no); border-bottom: 6px solid #B91C1C; }
        .btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        #status { margin-top: 10px; color: #666; font-weight: 600; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="question">Loading...</h1>
        <button class="btn btn-yes" onclick="vote('yes')">YES</button>
        <button class="btn btn-no" onclick="vote('no')">NO</button>
        <div id="status"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNYTlmO6HWFgHIPwVuXCSAWcrcoNoHVTPgDpbwOuVdhLUxsQ6epzYtG38-PTgFRDOo/exec"; // REPLACE THIS

        async function getQ() {
            const res = await fetch(API_URL);
            const data = await res.json();
            document.getElementById('question').innerText = (Array.isArray(data) ? data[0].question : data.question);
        }

        async function vote(side) {
            const status = document.getElementById('status');
            status.innerText = "Vote sent!";
            // qIndex is 0 because we only have one question now
            await fetch(`${API_URL}?qIndex=0&vote=${side}`, { mode: 'no-cors' });
            setTimeout(() => { status.innerText = ""; }, 2000);
        }

        getQ();
    </script>
</body>
</html>
