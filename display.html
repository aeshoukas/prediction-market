<!DOCTYPE html>
<html>
<head>
    <title>MARKET BOARD | LIVE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0e11; --card: #161a1e; --green: #00c076;
            --red: #ff3b30; --blue: #0066FF; --border: #2b2f36; --text-secondary: #848e9c;
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            box-sizing: border-box;
        }
        .header-container {
            display: grid; grid-template-columns: 320px 1fr 300px;
            gap: 30px; align-items: center; height: 280px; margin-bottom: 20px;
        }
        .gauge-section { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gauge-wrapper { position: relative; width: 260px; height: 130px; }
        .price-overlay { position: absolute; bottom: 2px; width: 100%; text-align: center; }
        .price-val { font-size: 64px; font-weight: 900; line-height: 0.8; }
        
        .leader-box { 
            margin-top: 15px; font-size: 16px; font-weight: 700; color: #fff;
            background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px;
            border: 1px solid var(--border); width: fit-content; text-align: center;
        }

        .question-text { font-size: 3vw; font-weight: 700; line-height: 1.2; margin: 0; }

        .qr-section { display: flex; flex-direction: column; align-items: center; }
        #timer { font-size: 44px; font-weight: 900; color: var(--text-secondary); margin-bottom: 10px; font-family: monospace; }
        
        .qr-container { 
            background: #fff; padding: 10px; border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center;
        }
        .qr-callout { color: #000; font-weight: 900; font-size: 20px; margin-bottom: 5px; }
        .qr-image { width: 160px; height: 160px; }
