<!DOCTYPE html>
<html>
<head>
    <title>MARKET BOARD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background: #0b0e11; color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 40px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .question { font-size: 3.5vw; font-weight: 800; margin-bottom: 10px; color: #fff; }
        
        .main-display { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; flex-grow: 1; align-items: center; }
        
        .price-card { background: #161a1e; border: 1px solid #2b2f36; border-radius: 24px; padding: 40px; text-align: center; }
        .price-val { font-size: 10vw; font-weight: 900; color: #00c076; line-height: 1; }
        .price-label { font-size: 1.5vw; color: #848e9c; text-transform: uppercase; letter-spacing: 2px; }

        .chart-container { background: #161a1e; border: 1px solid #2b2f36; border-radius: 24px; padding: 20px; height: 100%; position: relative; }
    </style>
</head>
<body>
    <div class="header">
        <div id="q-text" class="question">Loading Question...</div>
    </div>

    <div class="main-display">
        <div class="price-card">
            <div id="price" class="price-val">--¢</div>
            <div class="price-label">Chance of Yes</div>
            <div id="vol" style="margin-top: 20px; color: #848e9c;">Vol: 0</div>
        </div>
        
        <div class="chart-container">
            <canvas id="feverChart"></canvas>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNYTlmO6HWFgHIPwVuXCSAWcrcoNoHVTPgDpbwOuVdhLUxsQ6epzYtG38-PTgFRDOo/exec";
        let feverChart;

        async function update() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                document.getElementById('q-text').innerText = data.question;
                document.getElementById('price').innerText = data.percent + "¢";
                document.getElementById('vol').innerText = "Total Votes: " + (data.yes + data.no);

                updateChart(data.history);
            } catch(e) {}
        }

        function updateChart(historyData) {
            const ctx = document.getElementById('feverChart').getContext('2d');
            const labels = historyData.map((_, i) => i);
            
            if (feverChart) {
                feverChart.data.labels = labels;
                feverChart.data.datasets[0].data = historyData;
                feverChart.update('none'); // Update without animation for smoothness
            } else {
                feverChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Probability',
                            data: historyData,
                            borderColor: '#0066FF',
                            backgroundColor: 'rgba(0, 102, 255, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { min: 0, max: 100, grid: { color: '#2b2f36' }, ticks: { color: '#848e9c' } },
                            x: { display: false }
                        }
                    }
                });
            }
        }

        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
