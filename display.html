<!DOCTYPE html>
<html>
<head>
    <title>MARKET BOARD | LIVE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0e11; --card: #161a1e; --green: #00c076;
            --red: #ff3b30; --blue: #0066FF; --border: #2b2f36; --text-secondary: #848e9c;
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            box-sizing: border-box;
        }
        .header-container {
            display: grid; grid-template-columns: 320px 1fr 300px;
            gap: 30px; align-items: center; height: 280px; margin-bottom: 20px;
        }
        .gauge-section { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gauge-wrapper { position: relative; width: 260px; height: 130px; }
        .price-overlay { position: absolute; bottom: 2px; width: 100%; text-align: center; }
        .price-val { font-size: 64px; font-weight: 900; color: var(--green); line-height: 0.8; }
        
        .leader-box { 
            margin-top: 15px; font-size: 16px; font-weight: 700; color: #fff;
            background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px;
            border: 1px solid var(--border); width: fit-content;
        }

        .question-text { font-size: 3vw; font-weight: 700; line-height: 1.2; margin: 0; }

        .qr-container { 
            background: #fff; padding: 10px; border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center;
        }
        .qr-callout { color: #000; font-weight: 900; font-size: 20px; margin-bottom: 5px; }
        .qr-image { width: 180px; height: 180px; }

        .chart-frame { flex-grow: 1; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; position: relative; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="gauge-section">
            <div class="gauge-wrapper">
                <canvas id="gaugeChart"></canvas>
                <div class="price-overlay">
                    <div id="price" class="price-val">--¢</div>
                </div>
            </div>
            <div id="leaderboard" class="leader-box">Current leader: Calculating...</div>
        </div>

        <div class="question-section"><h1 id="q-text" class="question-text">Connecting...</h1></div>

        <div class="qr-section">
            <div class="qr-container">
                <div class="qr-callout">BET NOW</div>
                <img src="vote_qr.jpg" class="qr-image">
            </div>
        </div>
    </div>

    <div class="chart-frame">
        <canvas id="feverLineChart"></canvas>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx9MQh4KIS6tvFC6TKKwtc7aemH4hUBOKUpOLqNfGdQhfxtlTLbjXvowJupgzt9z--M/exec";
        let gaugeChart, feverChart;

        async function update() {
            try {
                const res = await fetch(API_URL);
                let data = await res.json();
                if (Array.isArray(data)) data = data[0];

                document.getElementById('q-text').innerText = data.question;
                const price = data.percent || 50;
                document.getElementById('price').innerText = price + "¢";
                document.getElementById('price').style.color = price > 49 ? '#00c076' : '#ff3b30';
                
                // Winning bettor logic: simple display from data
                const winner = data.lastBettor || "Anonymous";
                document.getElementById('leaderboard').innerText = `Current leader: ${winner}, $100`;

                drawGauge(price);
                drawFever(data.history || []);
            } catch(e) { console.error(e); }
        }

        function drawGauge(val) {
            const ctx = document.getElementById('gaugeChart').getContext('2d');
            if (gaugeChart) { gaugeChart.data.datasets[0].data = [val, 100-val]; gaugeChart.update(); return; }
            gaugeChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [val, 100-val], backgroundColor: [val > 49 ? '#00c076' : '#ff3b30', '#2b2f36'], borderWidth: 0, circumference: 180, rotation: 270, borderRadius: 20 }] },
                options: { cutout: '90%', maintainAspectRatio: false, plugins: { legend: {display: false}, tooltip: {enabled: false} } }
            });
        }

        function drawFever(history) {
            const ctx = document.getElementById('feverLineChart').getContext('2d');
            const currentPrice = history[history.length - 1] || 50;
            const lineColor = currentPrice > 49 ? '#00c076' : '#ff3b30';

            // Create x-axis labels 0 to 59
            const labels = Array.from({length: 60}, (_, i) => i);
            
            if (feverChart) {
                feverChart.data.datasets[0].data = history;
                feverChart.data.datasets[0].borderColor = lineColor;
                feverChart.data.datasets[0].pointBackgroundColor = lineColor;
                feverChart.data.datasets[0].pointRadius = history.map((_, i) => i === history.length - 1 ? 8 : 0);
                feverChart.update();
                return;
            }

            feverChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: history,
                        borderColor: lineColor,
                        borderWidth: 6,
                        fill: false,
                        tension: 0.3,
                        pointRadius: history.map((_, i) => i === history.length - 1 ? 8 : 0),
                        pointBackgroundColor: lineColor,
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    plugins: { legend: {display: false} },
                    scales: {
                        x: {
                            grid: { color: '#2b2f36' },
                            ticks: { color: '#848e9c', font: {weight: 'bold'}, callback: (v) => v % 10 === 0 ? ':' + (v < 10 ? '0'+v : v) : '' }
                        },
                        y: {
                            min: 0, max: 100,
                            grid: { color: '#2b2f36' },
                            ticks: { color: '#ffffff', font: {weight: '900', size: 20}, stepSize: 25, callback: (v) => v==0?'0':v==25?'25¢':v==50?'50¢':v==75?'75¢':v==100?'$1':'' }
                        }
                    }
                }
            });
        }

        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
