<!DOCTYPE html>
<html>
<head>
    <title>MARKET BOARD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0e11;
            --card: #161a1e;
            --green: #00c076;
            --blue: #0066FF;
            --border: #2b2f36;
            --text-secondary: #848e9c;
        }

        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; padding: 30px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            box-sizing: border-box;
        }

        /* Top Header Container */
        .header-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px; /* Locked ends, fluid middle */
            gap: 40px;
            align-items: center;
            height: 300px;
            margin-bottom: 20px;
        }

        /* 1. Left: Gauge Section */
        .gauge-section {
            width: 300px;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .gauge-wrapper {
            position: relative;
            width: 300px;
            height: 150px;
        }

        .price-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
        }

        .price-val {
            font-size: 80px;
            font-weight: 900;
            color: var(--green);
            line-height: 0.8;
        }

        .price-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* 2. Center: Question Section */
        .question-section {
            text-align: left;
        }

        .question-text {
            font-size: 3.5vw; /* Slightly scaled back */
            font-weight: 700;
            line-height: 1.2;
            margin: 0;
            color: #ffffff;
            /* Vertical rule removed as requested */
        }

        /* 3. Right: QR Code Section */
        .qr-section {
            width: 300px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-image {
            width: 260px; /* Margin for breathing room */
            height: 260px;
            border-radius: 12px;
            border: 4px solid #fff; /* Makes the QR pop on dark background */
        }

        .qr-label {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Bottom: Fever Chart Section */
        .chart-frame {
            flex-grow: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            position: relative;
        }

        .live-indicator {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--green);
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot { height: 8px; width: 8px; background-color: var(--green); border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="gauge-section">
            <div class="gauge-wrapper">
                <canvas id="gaugeChart"></canvas>
                <div class="price-overlay">
                    <div id="price" class="price-val">--¢</div>
                    <div class="price-label">Chance of YES</div>
                </div>
            </div>
        </div>

        <div class="question-section">
            <h1 id="q-text" class="question-text">Connecting...</h1>
        </div>

        <div class="qr-section">
            <img src="vote_qr.jpg" class="qr-image" alt="Scan to Vote">
            <div class="qr-label">Scan to predict</div>
        </div>
    </div>

    <div class="chart-frame">
        <div class="live-indicator"><span class="dot"></span> LIVE SENTIMENT</div>
        <canvas id="feverLineChart"></canvas>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwNYTlmO6HWFgHIPwVuXCSAWcrcoNoHVTPgDpbwOuVdhLUxsQ6epzYtG38-PTgFRDOo/exec";
        let gaugeChart, feverChart;

        async function update() {
            try {
                const res = await fetch(API_URL);
                let data = await res.json();
                if (Array.isArray(data)) data = data[0];

                document.getElementById('q-text').innerText = data.question;
                document.getElementById('price').innerText = (data.percent || 50) + "¢";
                
                drawGauge(data.percent || 50);
                drawFever(data.history || [50]);
            } catch(e) { console.error("Update error:", e); }
        }

        function drawGauge(val) {
            const ctx = document.getElementById('gaugeChart').getContext('2d');
            if (gaugeChart) {
                gaugeChart.data.datasets[0].data = [val, 100 - val];
                gaugeChart.update();
                return;
            }
            gaugeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [val, 100 - val],
                        backgroundColor: ['#00c076', '#2b2f36'],
                        borderWidth: 0,
                        circumference: 180,
                        rotation: 270,
                        borderRadius: 20
                    }]
                },
                options: { 
                    cutout: '82%', 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } } 
                }
            });
        }

        function drawFever(history) {
            const ctx = document.getElementById('feverLineChart').getContext('2d');
            if (feverChart) {
                feverChart.data.labels = history.map((_, i) => i);
                feverChart.data.datasets[0].data = history;
                feverChart.update('none');
                return;
            }
            feverChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map((_, i) => i),
                    datasets: [{
                        data: history,
                        borderColor: '#0066FF',
                        borderWidth: 5,
                        fill: true,
                        backgroundColor: (context) => {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                            gradient.addColorStop(0, 'rgba(0, 102, 255, 0.3)');
                            gradient.addColorStop(1, 'rgba(0, 102, 255, 0)');
                            return gradient;
                        },
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: { 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { 
                            min: 0, max: 100, 
                            grid: { color: '#2b2f36' },
                            ticks: { color: '#848e9c', font: { weight: 'bold' } }
                        }, 
                        x: { display: false } 
                    }
                }
            });
        }

        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
